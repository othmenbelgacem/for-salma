<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Salma's Garden</title>
<meta name="theme-color" content="#2a1b5e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Caveat:wght@500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#2a1b5e;color:#fff6ee;font:16px/1.5 'Nunito Sans',system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(.8rem + env(safe-area-inset-top)) 1rem 0;display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;pointer-events:none}
#cnt{font-weight:700;font-size:1.15rem;background:#0006;padding:.35rem .8rem;border-radius:99px;backdrop-filter:blur(4px)}
#cnt.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
#hint{flex:1;text-align:center;font-size:.9rem;background:#0005;padding:.4rem .8rem;border-radius:14px;max-width:340px;margin:0 auto;backdrop-filter:blur(4px)}
#prog{font-size:1.2rem;letter-spacing:.1em;background:#0006;padding:.3rem .7rem;border-radius:99px;pointer-events:auto}
#prog span{opacity:.35;transition:all .8s}#prog span.on{opacity:1;text-shadow:0 0 10px #ff8fb8}
#ltrBtn{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);animation:pulse 1.6s infinite}
.btn{font:700 1rem 'Nunito Sans',sans-serif;color:#4a1233;background:linear-gradient(#ffd0e0,#ff8fb8);border:0;border-radius:99px;padding:.8rem 1.8rem;cursor:pointer;box-shadow:0 0 26px #ff8fb899}
.btn.ghost{background:none;color:#fff6ee;border:1px solid #fff6;box-shadow:none}
:focus-visible{outline:2px solid #ffd23f;outline-offset:3px}
@keyframes pulse{50%{box-shadow:0 0 44px #ff8fb8;transform:translateX(-50%) scale(1.06)}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:1.2rem;background:#14082acc;backdrop-filter:blur(5px);z-index:5}
.ov.show{display:flex;animation:fi .6s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.in{max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center;background:linear-gradient(160deg,#3b2273,#2a1b5e);border:1px solid #ff8fb855;border-radius:20px;padding:1.6rem 1.4rem;box-shadow:0 0 60px #ff8fb844}
.in h3{font:600 1.9rem/1.15 'Cormorant Garamond',Georgia,serif;margin-bottom:.6rem;color:#ffd0e0}
.in p{margin-bottom:1.2rem;text-align:left}
.in img{max-width:100%;max-height:200px;border-radius:12px;margin-bottom:1rem}
.late{opacity:0;animation:fi 2.2s forwards}
h3.late{font-style:italic;font-size:1.55rem}
.hb{font-size:3rem;animation:hb 1.1s infinite;display:inline-block;margin-bottom:.4rem}
@keyframes hb{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1.08)}}
.paper{background:linear-gradient(#fbf1dc,#f1e2c2);color:#352a45;text-align:left;font-family:'Caveat','Segoe Script',cursive;font-size:clamp(1.3rem,4.8vw,1.6rem);line-height:1.45;border:0}
.paper p{opacity:0;animation:fi 1.6s forwards;color:#352a45;margin-bottom:.9rem}
.paper .hi{color:#a1264f;font-weight:500}
.paper .sg{text-align:right}
.row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;opacity:0;animation:fi 1.4s forwards}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

#ltr{padding:0;align-items:stretch;background:#14082a}
.sheet{width:100%;max-width:560px;margin:0 auto;height:100%;overflow-y:auto;overflow-x:hidden;background:linear-gradient(#fbf1dc,#f1e2c2);color:#352a45;font:clamp(1.3rem,4.8vw,1.6rem)/1.45 'Caveat','Segoe Script',cursive;text-align:left}
.x{position:fixed;top:calc(.7rem + env(safe-area-inset-top));right:.8rem;z-index:6;width:42px;height:42px;border-radius:50%;border:0;background:#352a4522;color:#352a45;font-size:1.1rem;cursor:pointer}
.gal{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:3rem 0 1.5rem}
.intro{text-align:center;padding:0 1.6rem;font-size:1.15em;opacity:0;animation:fi 2.2s .4s forwards}
.trk{position:relative;display:flex;gap:1.3rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:1.8rem calc(50% - min(35vw,130px)) 1.4rem;scrollbar-width:none;opacity:0;animation:fi 2s 1.6s forwards}
.trk::-webkit-scrollbar{display:none}
.pol{flex:0 0 min(70vw,260px);scroll-snap-align:center;perspective:900px;transform:rotate(var(--r));cursor:pointer;position:relative;outline-offset:6px}
.pol::before{content:'';position:absolute;top:-11px;left:50%;width:74px;height:22px;margin-left:-37px;background:#ffb3cf99;transform:rotate(-3deg);z-index:3;pointer-events:none}
.pi{position:relative;aspect-ratio:3/4.1;transition:transform .9s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.pol.flip .pi{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;box-shadow:0 10px 26px #3a1f5a40}
.fr{background:#fff;padding:11px 11px 0;display:flex;flex-direction:column}
.fr img{width:100%;flex:1;min-height:0;object-fit:cover;object-position:center 22%;border-radius:2px;display:block}
.fr span{text-align:center;padding:.45rem 0;font-size:.95em;color:#8a6a9a}
.bk{transform:rotateY(180deg);background:#fff9ec;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem;text-align:center;gap:.6rem;line-height:1.3}
.bk b{color:#e0457b;font-size:1.8rem}
.nav{display:flex;justify-content:center;align-items:center;gap:.4rem}
.nav button{background:none;border:0;font-size:2.2rem;line-height:1;color:#a1264f;cursor:pointer;padding:0 .8rem}
#dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#352a4533;margin:0 3px;transition:.3s}
#dots i.on{background:#e0457b;transform:scale(1.4)}
.cue{text-align:center;color:#a1264f;opacity:0;animation:fi 1.6s 3.6s forwards;cursor:pointer;margin-top:1rem}
.lb{padding:2.5rem 1.7rem 5rem}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1.5s ease,transform 1.5s ease;margin-bottom:1.05rem}
.rv.vis{opacity:1;transform:none}
.lb .hi{color:#a1264f;font-size:1.25em}.lb .sg{text-align:right;margin-top:1.8rem}
.lb .end{text-align:center;margin-top:3.5rem;color:#a1264f}
.btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.sheet .btn.ghost{color:#352a45;border-color:#352a4566}
.fh{position:fixed;z-index:9;pointer-events:none;font-size:1.4rem;animation:up 1.8s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-170px) scale(1.3)}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.intro,.trk,.cue{opacity:1}}
</style>
</head>
<body>
<canvas id="c" aria-label="A garden you can plant and water by tapping"></canvas>
<div id="hud"><div id="cnt">💗 0</div><div id="hint"></div><div id="prog" aria-label="Flowers bloomed"></div></div>
<button class="btn" id="ltrBtn" hidden>Open your letter 💌</button>

<div class="ov" id="card" role="dialog" aria-modal="true"><div class="in"><div class="hb" id="cHeart">💗</div><img id="cGif" alt="" hidden><h3 id="cT"></h3><div id="cF" style="font-style:italic;color:#ff8fb8;margin:-.3rem 0 .9rem"></div><p id="cP"></p><button class="btn" id="cX">Keep growing 🌸</button></div></div>
<div class="ov" id="fin" role="dialog" aria-modal="true"><div class="in"><div class="hb">💞</div><h3 class="late" id="fLine" style="animation-delay:1.6s"></h3><button class="btn late" id="fOpen" style="animation-delay:5s">Open your letter 💌</button></div></div>
<div class="ov" id="ltr" role="dialog" aria-modal="true" aria-label="Your letter"><button class="x" id="lX" aria-label="Close">✕</button><div class="sheet" id="lIn"></div></div>

<script>
/* =====================================================================
   ✏️ EDIT HERE ✏️  All the words of the game live in CONTENT.
   Anything marked SAMPLE is placeholder text: replace it with your real
   jokes, memories and plans before sending it to Salma.

   GIFS: for any flower, set  gif: "your-file.gif"  (upload the gif next
   to index.html) or paste a direct link ending in .gif (Giphy/Tenor).
   Leave it "" and a beating heart is shown instead.
   ===================================================================== */
const CONTENT = {
  name: "Salma",
  // The five flowers. Messages are revealed in the order the flowers bloom, so message 5 is always last.
  flowers: [
    { name: "You are seen", feeling: "Being understood", gif: "",
      text: "Salma, I wonder if you realize how beautiful you are in the little things you do. Not just in your smile, but in the way you talk, the little jokes you make, and the way an ordinary conversation with you can become the best part of my day. I hope you never feel that you have to be someone else to be special to me. There's something about the person you already are that makes me want to keep discovering more of you. ❤️" },
    { name: "You make ordinary days special", feeling: "Appreciation and warmth", gif: "",
      text: "It's strange how someone can be far away and still find a place in the smallest parts of your day. Sometimes, I'll remember something you said and smile without even realizing it. Sometimes, I'll want to tell you something simply because you're the person I want to share it with. You may think we're just talking, laughing, and teasing each other, but those little moments mean more to me than you probably know. 🌸" },
    { name: "You don't have to be perfect", feeling: "Acceptance and safety", gif: "",
      text: "I hope that with me, you can have days when you're not feeling your best, moments when you have nothing interesting to say, and times when you simply want to be yourself without pretending to be okay. You don't have to make every conversation perfect or always be the happiest version of yourself. I want to get to know the real you, not just the version of you that smiles. Because being close to someone should mean having room to be human, too. 🤍" },
    { name: "The little future I imagine", feeling: "Hope and anticipation", gif: "",
      text: "Sometimes I imagine the simplest day with you: walking beside you, making you laugh over something stupid, getting food together, or sitting next to you with nothing important to talk about. And what makes me smile isn't imagining some perfect romantic scene. It's imagining that one day, the little moments we can only describe through messages might become ordinary parts of our lives. I don't need every detail of the future figured out. I'm just happy that there's a future I'd love to discover with you. 🌷" },
    { name: "The message I saved for last", feeling: "What you mean to me", gif: "",
      text: "Salma, if I could give you one thing through this little screen, it would be the chance to see yourself for a moment through my eyes. Maybe then you'd understand why your messages matter, why your silly jokes stay in my head, and why someone so far away can feel so present in my life. I know a website can't hold your hand or give you a real hug, but I made this because I wanted you to have something you could open and remember: somewhere, there's a person who is genuinely happy that you became part of his story. And if I get to keep discovering yours while sharing mine with you, that's something I don't take for granted. ❤️" }
  ],
  // Shown in a quiet moment after the fifth flower
  finalLine: "Five flowers, five little pieces of my heart. And still, there are things about you I haven't found the words for yet. ❤️",
  // LETTER ---------------------------------------------------------
  letterIntro: "Before you read this, there's something I wish you could see…",
  // One caption per photo, shown on the back of each polaroid (8 photos). Make them yours!
  photoCaptions: [
    "Look at you.", "That little smile gets me every time.", "Some moments deserve flowers.", "Cozy and effortlessly you.",
    "Always full of style.", "A moment I'm glad exists.", "Sparkle suits you.", "Even from behind, you make a scene beautiful."
  ],
  letter: [
    "To my Salma, ❤️",
    "If you're reading this, you've found all five flowers. 🌷",
    "But there's something I couldn't quite fit into five little messages, something I wanted you to discover only when you reached the end.",
    "I wish you could see yourself through my eyes, even just for a moment.",
    "Maybe then you'd understand how someone can make me smile through a screen, how a silly conversation can stay in my mind long after it ends, and how a person living so far away can somehow become part of so many little moments in my day.",
    "Sometimes I wonder whether you realize how much beauty there is in simply being yourself. You don't have to do something extraordinary to leave an impression on me. Sometimes, it's just the way you talk, the things that make you laugh, or a completely ridiculous conversation that neither of us would ever think to call romantic. 😂❤️",
    "And honestly, I think that's one of the things I cherish most about us: we can be silly, tease each other, laugh at nonsense, and still have moments that mean something deeper.",
    "I know we're separated by distance. There are hugs we can't give, moments we can't share in person, and ordinary days we'd probably enjoy a little more if we could spend them together.",
    "But when I think about the future, I don't only imagine some perfect, cinematic moment. I imagine the little things. Walking beside you. Making you laugh when you're trying to be serious. Finding something delicious to eat. Arguing playfully over something completely unimportant. Looking at you and realizing that a moment I once imagined has quietly become real.",
    "Those are the moments I'd love to discover with you, one by one, in our own time.",
    "And until then, I wanted to give you something small that could hold a little of what words sometimes struggle to explain.",
    "So, if you ever open this page again, I hope it reminds you that you're not just a name on my screen or a person on the other side of a distance.",
    "You're someone whose presence has become meaningful to me. Someone I'm still discovering. Someone I can laugh with, learn about, and look forward to knowing more deeply.",
    "I can't promise that every day will be perfect, or that distance will always be easy. But I can tell you that the moments we share matter to me, and I want to keep making room for more of them.",
    "<b>And if there's one thing I hope you take away from this little world I made for you, it's this:</b>",
    "You don't have to be a flower in a perfect garden to be beautiful. Sometimes, simply being yourself is enough to make an ordinary little corner of someone's world feel special.",
    "Thank you for being part of mine, Salma. ❤️",
    "And one last thing...",
    "If I really were your fries, I'd still ask you not to share me with anyone. I have my limits, you know. 😭😂❤️"
  ],
  signoff: "With a smile that's probably your fault,<br><i>Othmen ❤️</i>",
  endLine: "The end of this little game… but hopefully just another page in our story. ❤️"
};
/* ===================== END OF EDITABLE CONTENT ===================== */

const $ = id => document.getElementById(id), R = Math.random, TAU = 6.2832;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COST = 3, KEY = 'salma-garden-v1';
const FL = [
  { n: 8, c: '#ff7aa8', m: '#ffd0e0' }, { n: 14, c: '#ffd23f', m: '#6b3a1a', big: 1.15 },
  { n: 10, c: '#ffffff', m: '#ffd23f' }, { n: 5, c: '#ff3d5a', m: '#ffd0a0', hp: 1 },
  { n: 6, c: '#b48cff', m: '#ffe9a8' }
];
let S = { hearts: 0, st: [0, 0, 0, 0, 0], won: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.st) S = s; } catch (e) {}
S.order = S.order || []; S.st.forEach((v, i) => { if (v === 3 && !S.order.includes(i)) S.order.push(i); });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const cv = $('c'), cx = cv.getContext('2d');
let W, H, D, ground, plots = [], hearts = [], parts = [], specks = [], petals = [], flies = [], ptr = { x: 0, y: 0, on: 0 };
let bloomed = () => S.st.filter(v => v === 3).length;

function size() {
  D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * D; cv.height = H * D; cx.setTransform(D, 0, 0, D, 0, 0);
  ground = H * .74;
  const old = plots; plots = [0, 1, 2, 3, 4].map(i => ({ x: W * (i + 1) / 6, y: ground + 26 + (i % 2) * 16, g: old[i] ? old[i].g : S.st[i] }));
  if (!specks.length) {
    for (let i = 0; i < 26; i++) specks.push({ x: R() * W, y: R() * H, p: R() * 6, s: 6 + R() * 10 });
    for (let i = 0; i < 12; i++) petals.push({ x: R() * W, y: R() * H, p: R() * 6, v: 14 + R() * 18, r: 5 + R() * 4 });
    for (let i = 0; i < 3; i++) flies.push({ x: R() * W, y: H * .4, p: R() * 6, c: ['#ff8fb8', '#ffd23f', '#9ad8ff'][i] });
  }
}

function heart(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .9);
  c.bezierCurveTo(x - s * 1.4, y - s * .1, x - s * .7, y - s * 1.1, x, y - s * .4);
  c.bezierCurveTo(x + s * .7, y - s * 1.1, x + s * 1.4, y - s * .1, x, y + s * .9); c.closePath();
}
function burst(x, y, n, big) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (R() - .5) * (big ? 340 : 170), vy: -R() * (big ? 300 : 170) - 30, l: 1, s: 4 + R() * (big ? 9 : 6), c: ['#ff8fb8', '#ff3d5a', '#ffd0e0', '#ffd23f'][i % 4] });
}

function flower(p, i, t) {
  const g = p.g, x = p.x, y = p.y, f = FL[i];
  cx.fillStyle = '#6b4a3a'; cx.beginPath(); cx.ellipse(x, y, 24, 9, 0, 0, TAU); cx.fill();
  if (g < .05) { cx.fillStyle = '#ffffff22'; cx.beginPath(); cx.ellipse(x, y, 24, 9, 0, 0, TAU); cx.fill(); return; }
  if (g < 1) { cx.fillStyle = '#e8c9a0'; cx.beginPath(); cx.ellipse(x, y - 3, 3 + g * 3, 2 + g * 3, 0, 0, TAU); cx.fill(); return; }
  const hS = H * .07, hF = H * .19 + (i % 3) * 9;
  const h = g < 2 ? (g - 1) * hS : hS + Math.min(g - 2, 1) * (hF - hS);
  const sw = reduce ? 0 : Math.sin(t * 1.4 + i) * (3 + h * .05), tx = x + sw, ty = y - h;
  cx.strokeStyle = '#4fa35c'; cx.lineWidth = 3.5; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x, y); cx.quadraticCurveTo(x + sw * .2, y - h * .5, tx, ty); cx.stroke();
  cx.fillStyle = '#62c470';
  if (h > 8) for (const s of [-1, 1]) { cx.beginPath(); cx.ellipse(x + s * 10 + sw * .15, y - h * .35, 10, 4.5, -s * .5, 0, TAU); cx.fill(); }
  const b = Math.max(0, Math.min(1, (g - 2.2) / .8));
  if (b === 0) { cx.fillStyle = f.c; cx.beginPath(); cx.ellipse(tx, ty - 4, 4.5, 7, 0, 0, TAU); cx.fill(); return; }
  const r = H * .05 * (f.big || 1) * b;
  cx.save(); cx.translate(tx, ty); cx.rotate(sw * .012 + t * .1 * b); cx.shadowColor = f.c; cx.shadowBlur = 16;
  cx.fillStyle = f.c;
  for (let k = 0; k < f.n; k++) {
    cx.save(); cx.rotate(k / f.n * TAU);
    if (f.hp) heart(cx, 0, -r * .95, r * .65); else { cx.beginPath(); cx.ellipse(0, -r * .8, r * .3, r * .62, 0, 0, TAU); }
    cx.fill(); cx.restore();
  }
  cx.shadowBlur = 0; cx.fillStyle = f.m; cx.beginPath(); cx.arc(0, 0, r * .3, 0, TAU); cx.fill(); cx.restore();
}

let last = 0, spawn = 0, T = 0;
function frame(ts) {
  const dt = Math.min((ts - last) / 1000 || 0, .05); last = ts; T += dt;
  const bl = bloomed() / 5;
  const sk = cx.createLinearGradient(0, 0, 0, ground);
  sk.addColorStop(0, '#2a1b5e'); sk.addColorStop(.55, '#8e4a9e'); sk.addColorStop(1, '#ffb08a');
  cx.fillStyle = sk; cx.fillRect(0, 0, W, H);
  const sun = cx.createRadialGradient(W / 2, ground, 0, W / 2, ground, H * (.2 + bl * .5));
  sun.addColorStop(0, `rgba(255,220,150,${.25 + bl * .6})`); sun.addColorStop(1, 'rgba(255,200,150,0)');
  cx.fillStyle = sun; cx.fillRect(0, 0, W, H);
  cx.fillStyle = '#fff'; for (let i = 0; i < 30; i++) { cx.globalAlpha = (1 - bl * .7) * (.3 + .4 * Math.sin(T * 2 + i)); cx.fillRect((i * 97) % W, (i * 53) % (ground * .5), 1.6, 1.6); } cx.globalAlpha = 1;
  cx.fillStyle = '#5a3a86'; cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) cx.lineTo(x, ground - 30 + Math.sin(x / 90) * 18); cx.lineTo(W, H); cx.fill();
  const gr = cx.createLinearGradient(0, ground, 0, H); gr.addColorStop(0, '#2f7a5c'); gr.addColorStop(1, '#1b4a45');
  cx.fillStyle = gr; cx.fillRect(0, ground, W, H - ground);

  for (const s of specks) { const a = .5 + .5 * Math.sin(T * 1.5 + s.p); s.x += Math.sin(T * .3 + s.p) * 6 * dt; s.y -= 4 * dt; if (s.y < 0) s.y = H;
    cx.globalAlpha = a * .8; const gl = cx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.s); gl.addColorStop(0, '#fff3b0'); gl.addColorStop(1, 'rgba(255,243,176,0)'); cx.fillStyle = gl; cx.fillRect(s.x - s.s, s.y - s.s, s.s * 2, s.s * 2); }
  cx.globalAlpha = 1;
  if (!reduce) for (const p of petals) { p.y += p.v * dt; p.x += Math.sin(T + p.p) * 20 * dt; if (p.y > H) { p.y = -10; p.x = R() * W; }
    cx.fillStyle = '#ffb3cf'; cx.globalAlpha = .7; cx.beginPath(); cx.ellipse(p.x, p.y, p.r, p.r * .5, T + p.p, 0, TAU); cx.fill(); } cx.globalAlpha = 1;

  plots.forEach((p, i) => { p.g += (S.st[i] - p.g) * Math.min(1, dt * 2.2); flower(p, i, T); });

  spawn -= dt; if (spawn <= 0 && hearts.length < 9) { hearts.push({ x: 30 + R() * (W - 60), y: -20, v: 45 + R() * 40, s: 11 + R() * 7, p: R() * 6, c: ['#ff5c8a', '#ff8fb8', '#ff3d5a'][(R() * 3) | 0] }); spawn = .8 + R() * .5; }
  hearts = hearts.filter(h => h.y < ground + 30);
  for (const h of hearts) { h.y += h.v * dt; h.x += Math.sin(T * 2 + h.p) * 22 * dt;
    cx.save(); cx.translate(h.x, h.y); cx.rotate(Math.sin(T * 2 + h.p) * .25); cx.shadowColor = h.c; cx.shadowBlur = 14; cx.fillStyle = h.c; heart(cx, 0, 0, h.s); cx.fill(); cx.restore(); }

  for (const f of flies) { const tx = ptr.on ? ptr.x : W / 2 + Math.sin(T * .4 + f.p) * W * .35, ty = ptr.on ? ptr.y - 20 : H * .35 + Math.cos(T * .6 + f.p) * H * .15;
    f.x += (tx - f.x) * dt * .9 + Math.sin(T * 3 + f.p) * 25 * dt; f.y += (ty - f.y) * dt * .9 + Math.cos(T * 4 + f.p) * 25 * dt;
    const w = Math.abs(Math.sin(T * 14 + f.p)); cx.fillStyle = f.c; cx.globalAlpha = .9;
    for (const s of [-1, 1]) { cx.beginPath(); cx.ellipse(f.x + s * 5 * w, f.y, 6 * w + 1, 8, s * .4, 0, TAU); cx.fill(); } cx.globalAlpha = 1; }

  parts = parts.filter(p => p.l > 0);
  for (const p of parts) { p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt * .9; cx.globalAlpha = Math.max(p.l, 0); cx.fillStyle = p.c; heart(cx, p.x, p.y, p.s); cx.fill(); } cx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

function hud() {
  $('cnt').textContent = '💗 ' + S.hearts;
  $('prog').innerHTML = S.st.map(v => `<span class="${v === 3 ? 'on' : ''}">🌸</span>`).join('');
  const n = S.st, grow = n.some(v => v === 1 || v === 2);
  $('hint').textContent = bloomed() === 5 ? 'Your garden is complete 💞'
    : grow && S.hearts >= COST ? `Tap a sprout to water it (costs ${COST} 💗)`
    : grow ? 'Tap the falling hearts to collect them 💗'
    : n.some(v => v === 0) ? 'Tap the soil to plant a seed 🌱' : 'Keep growing…';
  $('ltrBtn').hidden = !S.won;
}
function bump() { const c = $('cnt'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }

function showCard(i) {
  const f = CONTENT.flowers[Math.max(0, S.order.indexOf(i))], g = $('cGif');
  $('cF').textContent = f.feeling || '';
  $('cT').textContent = f.name; $('cP').textContent = f.text;
  g.hidden = !f.gif; g.src = f.gif || ''; $('cHeart').hidden = !!f.gif;
  $('card').classList.add('show'); $('cX').focus();
}
function closeCard() {
  $('card').classList.remove('show');
  if (bloomed() === 5 && !S.won) { S.won = true; save(); hud(); burst(W / 2, ground, 40, true); setTimeout(() => $('fin').classList.add('show'), 900); }
}
function floatHearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span'); h.className = 'fh'; h.textContent = ['💗', '🌸', '💖', '💕'][i % 4];
    h.style.left = x + (R() - .5) * 70 + 'px'; h.style.top = y + 'px'; h.style.setProperty('--dx', (R() - .5) * 130 + 'px'); h.style.animationDelay = i * .09 + 's';
    document.body.appendChild(h); setTimeout(() => h.remove(), 2400);
  }
}
function showLetter() {
  $('fin').classList.remove('show');
  const P = typeof PHOTOS !== 'undefined' ? PHOTOS : [], L = $('lIn');
  const pols = P.map((src, i) => `<div class="pol" style="--r:${i % 2 ? 2.2 : -2.2}deg" tabindex="0" role="button" aria-label="Photo ${i + 1} of ${P.length}. Press to turn it over."><div class="pi"><div class="fc fr"><img src="${src}" alt=""><span>tap to turn me over ♡</span></div><div class="fc bk"><span style="font-size:1.35em">${CONTENT.photoCaptions[i] || ''}</span><b>♡</b></div></div></div>`).join('');
  const gal = P.length ? `<section class="gal"><p class="intro">${CONTENT.letterIntro}</p><div class="trk" id="trk">${pols}</div><div class="nav"><button id="pv" aria-label="Previous photo">‹</button><div id="dots">${P.map(() => '<i></i>').join('')}</div><button id="nx" aria-label="Next photo">›</button></div><div class="cue" id="cue">scroll down to read ↓</div></section>` : '';
  L.innerHTML = gal + `<section class="lb" id="lb">${CONTENT.letter.map((t, i) => `<p class="rv${i ? '' : ' hi'}">${t}</p>`).join('')}<p class="rv sg">${CONTENT.signoff}</p><p class="rv end" id="lEnd">${CONTENT.endLine}</p><div class="btns rv"><button class="btn" id="lBack">Back to the garden 🌸</button><button class="btn ghost" id="lAgain">Plant it again</button></div></section>`;
  L.scrollTop = 0; $('ltr').classList.add('show');
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; e.target.classList.add('vis'); io.unobserve(e.target);
    if (e.target.id === 'lEnd') for (let k = 0; k < 4; k++) setTimeout(() => floatHearts(innerWidth / 2, innerHeight * .6, 5), k * 500);
  }), { root: L, threshold: .15, rootMargin: '0px 0px -6% 0px' });
  L.querySelectorAll('.rv').forEach(el => io.observe(el));
  if (P.length) {
    const trk = $('trk'), cards = [...trk.children], dots = [...document.querySelectorAll('#dots i')]; let cur = 0;
    const upd = () => { const m = trk.scrollLeft + trk.clientWidth / 2; let bd = 1e9; cards.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - m); if (d < bd) { bd = d; cur = i; } }); dots.forEach((d, i) => d.classList.toggle('on', i === cur)); };
    const goTo = i => { const c = cards[Math.max(0, Math.min(cards.length - 1, i))]; trk.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - trk.clientWidth / 2, behavior: 'smooth' }); };
    trk.onscroll = upd; setTimeout(upd, 50);
    $('pv').onclick = () => goTo(cur - 1); $('nx').onclick = () => goTo(cur + 1);
    $('cue').onclick = () => $('lb').scrollIntoView({ behavior: 'smooth' });
    cards.forEach(c => {
      const f = () => { c.classList.toggle('flip'); const r = c.getBoundingClientRect(); floatHearts(r.left + r.width / 2, r.top + r.height / 2, 6); };
      c.onclick = f; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } };
    });
  }
  $('lBack').onclick = () => $('ltr').classList.remove('show');
  $('lAgain').onclick = () => { if (confirm('Start a brand new garden?')) { S = { hearts: 0, st: [0, 0, 0, 0, 0], won: false, order: [] }; save(); $('ltr').classList.remove('show'); hud(); } };
}
cv.addEventListener('pointermove', e => { ptr = { x: e.clientX, y: e.clientY, on: 1 }; });
cv.addEventListener('pointerdown', e => {
  const x = e.clientX, y = e.clientY; ptr = { x, y, on: 1 };
  const k = hearts.findIndex(h => Math.hypot(h.x - x, h.y - y) < h.s + 22);
  if (k > -1) { const h = hearts.splice(k, 1)[0]; S.hearts++; burst(h.x, h.y, 8); bump(); save(); hud(); return; }
  const i = plots.findIndex((p, j) => Math.abs(p.x - x) < 36 && y > p.y - (S.st[j] === 3 ? H * .3 : S.st[j] === 2 ? H * .14 : 50) - 20 && y < p.y + 24);
  if (i > -1) {
    const v = S.st[i];
    if (v === 0) { S.st[i] = 1; burst(plots[i].x, plots[i].y, 6); }
    else if (v < 3) {
      if (S.hearts < COST) { $('hint').textContent = `You need ${COST} 💗. Catch some falling hearts first!`; return; }
      S.hearts -= COST; S.st[i]++; burst(plots[i].x, plots[i].y - 20, 14);
      if (S.st[i] === 3) { S.order.push(i); setTimeout(() => { burst(plots[i].x, plots[i].y - H * .2, 26, true); setTimeout(() => showCard(i), 700); }, 1500); }
    } else showCard(i);
    save(); hud(); return;
  }
  burst(x, y, 5);
});
cv.addEventListener('pointerup', () => { if (ptr.on && matchMedia('(hover:none)').matches) ptr.on = 0; });
$('fLine').textContent = CONTENT.finalLine;
$('lX').onclick = () => $('ltr').classList.remove('show');
$('cX').onclick = closeCard; $('fOpen').onclick = showLetter; $('ltrBtn').onclick = showLetter;
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('card').classList.contains('show')) closeCard(); $('ltr').classList.remove('show'); } });
addEventListener('resize', size);
size(); hud(); requestAnimationFrame(frame);
